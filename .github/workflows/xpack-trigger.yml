name: xpack compat
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions: {}
# A newer build of the same PR branch cancels the wait for the older one.
concurrency:
  group: xpack-compat-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  xpack-compat:
    # Only after a passing PR build. A fork build needs a maintainer's approval first.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # This job runs on the default branch, so the PR shows only this check run.
      - id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check=$(gh api repos/$GITHUB_REPOSITORY/check-runs -f name=xpack-compat -f head_sha="$SHA" -f status=in_progress -q .id)
          echo "check=$check" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.PRIV_TRIGGER_APP_ID }}
          private-key: ${{ secrets.PRIV_TRIGGER_APP_KEY }}
          owner: jorgee-tests-labs
          repositories: priv-repo-test

      # Never check out PR code here: this job holds a secret.
      - id: run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          repo=repos/jorgee-tests-labs/priv-repo-test
          wf=$repo/actions/workflows/nextflow-compat.yml
          # REST call, not `gh workflow run`: that also looks up the default branch, which needs Contents: read.
          gh api $wf/dispatches -f ref=main -f "inputs[sha]=$SHA" -f "inputs[pr]=$PR" -f "inputs[id]=$ID"

          # The dispatch API returns no run id, so find the run by the id in its name.
          until run=$(gh api "$wf/runs?event=workflow_dispatch&per_page=20" \
              -q ".workflow_runs[] | select(.display_title | endswith(\"[$ID]\")) | .id") && [ -n "$run" ]; do
            sleep 5
          done
          until [ "$(gh api $repo/actions/runs/$run -q .status)" = completed ]; do sleep 30; done

          # Only job names and conclusions are read: the xpack logs are private.
          if [ "$(gh api $repo/actions/runs/$run -q .conclusion)" = success ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "title=No xpack break found" >> "$GITHUB_OUTPUT"
          elif gh api $repo/actions/runs/$run/jobs -q '.jobs[] | select(.conclusion == "failure") | .name' | grep -qx select; then
            echo "conclusion=neutral" >> "$GITHUB_OUTPUT"
            echo "title=Not checked: a maintainer must add the xpack-check label and re-run the build" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "title=May break xpack. Ask the Seqera team before merging." >> "$GITHUB_OUTPUT"
          fi

      # Also runs when the job is cancelled or fails, so the check never stays "in progress".
      - if: always() && steps.start.outputs.check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ steps.start.outputs.check }}
          CONCLUSION: ${{ steps.run.outputs.conclusion || 'cancelled' }}
          TITLE: ${{ steps.run.outputs.title || 'The xpack check did not finish' }}
        run: |
          gh api -X PATCH repos/$GITHUB_REPOSITORY/check-runs/$CHECK -f status=completed \
            -f conclusion="$CONCLUSION" -f "output[title]=$TITLE" -f "output[summary]=$TITLE"
